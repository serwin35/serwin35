name: Update annual profile numbers

on:
  schedule:
    - cron: '23 5 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recalculate README numbers
        run: node scripts/update-readme.mjs

      - name: Commit the annual update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already current."
            exit 0
          fi
          git commit -m "Update annual profile numbers"
          git push
